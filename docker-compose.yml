services:
  auth-idp:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AUTH_REVISION: ${AUTH_REVISION:-unknown}
      # Framework source defaults to the immutable revision in Dockerfile.
    image: auth-idp:latest
    container_name: auth-idp
    restart: unless-stopped
    ports:
      - "${IDP_PORT:-8088}:${IDP_PORT:-8088}"
    environment:
      # ── Server ──────────────────────────────────────────────────────
      - IDP_PORT=${IDP_PORT:-8088}
      - IDP_BASE_URL=${IDP_BASE_URL:?Configure the public HTTPS origin including its port}
      - IDP_ISSUER=${IDP_BASE_URL:?Configure IDP_BASE_URL}
      - HOST_REDIRECTS=${HOST_REDIRECTS:-}
      # ── Paths ───────────────────────────────────────────────────────
      - IDP_PRIVATE_KEY_PATH=/app/keys/private_key.pem
      - IDP_PUBLIC_KEY_PATH=/app/keys/public_key.pem
      - DB_PATH=/app/data/auth.db
      # ── Security ────────────────────────────────────────────────────
      - TOTP_KEY_PATH=/app/keys/totp.key
      - IDP_CLIENTS=${IDP_CLIENTS:?Configure IDP_CLIENTS}
      # ── Federated Login (optional) ───────────────────────────────────
      - OAUTH_GOOGLE_CLIENT_ID=${OAUTH_GOOGLE_CLIENT_ID:-}
      - OAUTH_GOOGLE_CLIENT_SECRET=${OAUTH_GOOGLE_CLIENT_SECRET:-}
      # ── SMTP ────────────────────────────────────────────────────────
      - SMTP_COMMAND=${SMTP_COMMAND:-}
    command: ["/app/auth_idp", "IdpServer", "local", "--host", "0.0.0.0", "tls", "--cert", "/app/tls/fullchain.pem", "--cert-key", "/app/tls/privkey.pem"]
    volumes:
      # Persistent data (survives container restarts and upgrades)
      - ${TLS_CERTIFICATE:?Set the full-chain PEM path}:/app/tls/fullchain.pem:ro
      - ${TLS_PRIVATE_KEY:?Set the private-key PEM path}:/app/tls/privkey.pem:ro
      - auth_keys:/app/keys
      - auth_data:/app/data
    healthcheck:
      test: ["CMD", "/bin/sh", "/app/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  auth_keys:
    driver: local
  auth_data:
    driver: local
